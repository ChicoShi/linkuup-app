andortfreigabe löscht diesen bereits gespeicherten Wert nicht automatisch. Die genauen Koordinaten werden nicht als Bewegungsprofil veröffentlicht. Die Besuchshistorie ist eine eigene Profilfunktion und unterliegt deiner Sichtbarkeitseinstellung.</li>\n  <li><strong>Chats, Kommentare, Bewertungen, Freundschaften und Cuddles:</strong> zur Bereitstellung der jeweiligen sozialen Funktion. Inhalte sind für die Personen sichtbar, für die die gewählte Funktion bestimmt ist; öffentliche bzw. Raum-Inhalte können andere berechtigte Raumnutzende sehen.</li>\n  <li><strong>Technik und Sicherheit:</strong> IP-Adresse, Zeitstempel, Geräte-/Browserdaten, Fehler- und Serverprotokolle – zur Auslieferung, Missbrauchsabwehr und Fehleranalyse.</li>\n</ul>\n\n<h2>3. Rechtsgrundlagen, Empfänger, Dauer</h2>\n<p>Die Verarbeitung erfolgt zur Bereitstellung des Nutzerkontos und der gewählten Funktionen (Art. 6 Abs. 1 lit. b DSGVO), aufgrund deiner Einwilligung bei optionalen Freigaben wie Standort oder optionalen Profilangaben (lit. a) sowie zur Sicherheit und Missbrauchsabwehr (lit. f). Empfänger sind nur technisch notwendige Hosting-/IT-Dienstleister, berechtigte LinkUUp-Nutzende nach deiner Sichtbarkeit und Stellen, soweit eine gesetzliche Pflicht besteht. Kontodaten bleiben bis zur Löschung des Kontos gespeichert; Inhalte und technische Daten nur so lange, wie sie für Funktion, Sicherheit, Rechtsansprüche oder gesetzliche Pflichten erforderlich sind. Nutzername, E-Mail und Passwort sind für ein Konto erforderlich; ohne sie ist keine Registrierung möglich.</p>\n\n<h2>4. Deine Kontrolle</h2>\n<p>Du kannst Standortfreigabe jederzeit in Browser- oder Geräteeinstellungen widerrufen; dann sind ortsabhängige Funktionen eingeschränkt. Profil-Sichtbarkeiten änderst du in den Einstellungen. Bilder und eigene Inhalte kannst du in der App löschen; mit einem Bild verschwinden auch seine zugehörigen Inhalte, soweit technisch und rechtlich möglich. Erteilte Einwilligungen kannst du jederzeit mit Wirkung für die Zukunft widerrufen. Die Rechtmäßigkeit der Verarbeitung vor dem Widerruf bleibt davon unberührt. Wenn du die Löschung bereits gespeicherter Standortdaten beantragen möchtest, wende dich an info@linkuup.de.</p>\n\n<h2>5. Cookies und externe Links</h2>\n<p>Notwendige Sitzungs-/Sicherheitscookies werden für Anmeldung und den von dir gewünschten Dienst eingesetzt. Nicht notwendige Cookies oder vergleichbare Zugriffe auf dein Gerät werden erst nach einer erforderlichen Einwilligung verwendet. Externe Seiten, etwa Karten-, Webseiten- oder Social-Media-Links eines Ortes, werden erst geöffnet, wenn du sie selbst auswählst; dafür gelten deren Datenschutzregeln.</p>\n\n<h2>6. Deine Rechte</h2>\n<p>Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch und Beschwerde bei einer Datenschutzaufsicht. Zuständig am Sitz des Verantwortlichen ist der Landesbeauftragte für den Datenschutz Niedersachsen, Prinzenstraße 5, 30159 Hannover. Anfragen bitte an <a href=\"mailto:info@linkuup.de\">info@linkuup.de</a>.</p>\n\n<h2>7. Keine automatisierten Entscheidungen</h2>\n<p>LinkUUp trifft keine automatisierten Entscheidungen mit rechtlicher oder vergleichbar erheblicher Wirkung über dich. Die technische Standortprüfung entscheidet nur, ob die von dir gewählte Ortschat-Funktion verfügbar ist.</p>\n\n<p><small>Stand: 13. September 2026. Diese Erklärung beschreibt den aktuellen Funktionsstand. Neue optionale Drittanbieter- oder Analyse-Funktionen werden vor ihrem Einsatz ergänzt und, soweit nötig, nur nach Einwilligung aktiviert.</small></p>\n", "IMPRESSUM": "\n\n<h1>Impressum</h1>\n<p><strong>Angaben gemäß § 5 DDG</strong></p>\n<p>Shqiprim Mehmeti<br>Hauptstraße 25B<br>38110 Braunschweig</p>\n<p>E-Mail: <a href=\"mailto:info@linkuup.de\">info@linkuup.de</a></p>\n\n<h2>Inhalte und Links</h2>\n<p>Eigene Inhalte werden nach den allgemeinen Gesetzen verantwortet. Für Inhalte externer Links sind deren Anbieter verantwortlich. Hinweise auf
