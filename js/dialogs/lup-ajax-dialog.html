<md-dialog aria-label="{{data.title|translate}}" class="place-dialog place-legal-dialog">
  <header class="place-dialog-header"><span class="place-dialog-symbol" aria-hidden="true"><i class="material-icons">{{data.title === 'PRIVACY' ? 'shield' : (data.title === 'IMPRESSUM' ? 'alternate_email' : 'description')}}</i></span><div><span>{{'PLACE_LEGAL_HEADING'|translate}}</span><h2>{{data.title|translate}}</h2></div><button type="button" class="place-dialog-close" ng-click="cancel()" aria-label="{{'PLACE_CLOSE'|translate}}"><i class="material-icons" aria-hidden="true">close</i></button></header>
  <md-dialog-content tabindex="0" aria-label="{{data.title|translate}}"><div class="place-dialog-body place-legal-document" ng-bind-html="data.html"></div></md-dialog-content>
  <footer class="place-dialog-actions"><button type="button" class="place-dialog-primary" ng-click="cancel()">{{'PLACE_CLOSE'|translate}}</button></footer>
</md-dialog>
