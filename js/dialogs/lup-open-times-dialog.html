<md-dialog class="place-dialog" aria-label="{{'OPEN_TIMES'|translate}}"><form ng-cloak><header class="place-dialog-header"><span class="place-dialog-symbol" aria-hidden="true"><i class="material-icons">schedule</i></span><div><span>{{'PLACE_CATEGORY'|translate}}</span><h2>{{'OPEN_TIMES'|translate}}</h2></div><button class="place-dialog-close" type="button" ng-click="cancel()" aria-label="{{'PLACE_CLOSE'|translate}}"><i class="material-icons" aria-hidden="true">close</i></button></header><md-dialog-content><div class="place-dialog-body"><p class="place-dialog-room">{{room.name()}}</p><p class="place-hours-label" ng-if="room.openTimes()">{{'PLACE_STORED_HOURS'|translate}}</p><div class="place-hours" ng-if="room.openTimes()">{{room.openTimes()}}</div><p class="place-dialog-copy" ng-if="!room.openTimes()">{{'OPEN_TIMES_NONE'|translate}}</p><a class="place-contact-call place-hours-google" ng-href="{{room.mapsListingHref()}}" target="_blank" rel="noopener"><i class="material-icons" aria-hidden="true">open_in_new</i>{{'PLACE_CHECK_GOOGLE'|translate}}</a></div></md-dialog-content><footer class="place-dialog-actions"><button class="place-dialog-primary" type="button" ng-click="cancel()">{{'PLACE_DONE'|translate}}</button></footer></form></md-dialog>
