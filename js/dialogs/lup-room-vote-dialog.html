<md-dialog aria-label="{{'ROOM_VOTE'|translate}}" class="lup-comment-dialog vote-dialog">
  <form ng-cloak>
    <md-toolbar>
      <div class="md-toolbar-tools">
		<div class="vote-dialog-title"><span>{{'LUP_VOTE_EYEBROW'|translate}}</span><h2>{{'LUP_VOTE_TITLE'|translate}}</h2></div>
        <span flex></span>
		<button class="vote-dialog-close" type="button" ng-click="cancel()" aria-label="{{'BTN_CANCEL'|translate}}">
			<i class="material-icons">close</i>
		</button>
      </div>
    </md-toolbar>

    <md-dialog-content>
      <div class="md-dialog-content" layout="column">

		<div class="vote-dialog-intro"><span class="vote-dialog-mark"><i class="material-icons">forum</i></span><p>{{'LUP_VOTE_COPY'|translate}}</p></div>
		<p class="vote-dialog-note" ng-if="data.comment">{{'LUP_VOTE_UPDATE_NOTE'|translate}}</p>
		<section class="vote-rating-panel">
		  <span>{{'LUP_VOTE_RATING'|translate}}</span>
		  <jk-rating-stars max-rating="5" rating="data.rating" reset-allowed="false"></jk-rating-stars>
		</section>
      
        <md-input-container flex>
		  <label>{{'LUP_VOTE_COMMENT'|translate}}</label>
          <textarea ng-model="data.comment" rows="4" placeholder="{{'LUP_VOTE_PLACEHOLDER'|translate}}" style="width: 100%;" flex>
          </textarea>
        </md-input-container>
      
      </div>
    </md-dialog-content>

    <md-dialog-actions layout="row">
      <md-button ng-click="cancel()">{{'BTN_CANCEL'|translate}}</md-button>
		<md-button class="vote-save" ng-click="vote()">{{'LUP_VOTE_SUBMIT'|translate}}</md-button>
    </md-dialog-actions>

  </form>
</md-dialog>
