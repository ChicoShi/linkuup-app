<md-dialog class="place-dialog" aria-label="{{'PLACE_PHONE'|translate}}"><form ng-cloak><header class="place-dialog-header"><span class="place-dialog-symbol" aria-hidden="true"><i class="material-icons">call</i></span><div><span>{{'PLACE_CATEGORY'|translate}}</span><h2>{{'PLACE_PHONE'|translate}}</h2></div><button class="place-dialog-close" type="button" ng-click="cancel()" aria-label="{{'PLACE_CLOSE'|translate}}"><i class="material-icons" aria-hidden="true">close</i></button></header><md-dialog-content><div class="place-dialog-body"><p class="place-dialog-room">{{room.name()}}</p><p class="place-dialog-copy" ng-if="room.phone()" translate="PHONE_TEXT" translate-values="{room_name:room.name()}"></p><a class="place-contact-call" ng-if="room.phone()" ng-href="tel:{{room.phone()}}"><i class="material-icons" aria-hidden="true">call</i>{{room.phone()}}</a><p class="place-dialog-copy" ng-if="!room.phone()" translate="PHONE_NONE" translate-values="{room_name:room.name()}"></p></div></md-dialog-content><footer class="place-dialog-actions"><button class="place-dialog-primary" type="button" ng-click="cancel()">{{'PLACE_DONE'|translate}}</button></footer></form></md-dialog>
