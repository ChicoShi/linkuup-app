<md-dialog class="place-dialog" aria-label="{{data.title}}"><form ng-cloak><header class="place-dialog-header"><div><h2>{{data.title}}</h2></div><button type="button" class="place-dialog-close" ng-click="cancel()" aria-label="{{'PLACE_CLOSE'|translate}}"><i class="material-icons" aria-hidden="true">close</i></button></header><md-dialog-content><div class="place-dialog-body" compile="data.body"></div></md-dialog-content><footer class="place-dialog-actions"><button type="button" class="place-dialog-primary" ng-click="ok()">{{'OK'|translate}}</button></footer></form></md-dialog>
