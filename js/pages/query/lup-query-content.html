<div class="place-chat place-private-chat" layout="column" flex><div class="chat-msgs place-messages" flex id="lup-query-list-{{data.chat.id()}}" role="log" aria-label="{{'PLACE_PRIVATE_CHAT'|translate}}" aria-live="polite" aria-relevant="additions text"><section class="place-empty" ng-if="data.chat && !data.chat.messages.length"><span class="place-empty-mark"><i class="material-icons" aria-hidden="true">waving_hand</i></span><h3>{{'PLACE_CHAT_EMPTY'|translate}}</h3><p>{{'PLACE_PRIVATE_EMPTY_COPY'|translate}}</p></section><div ng-repeat="msg in data.chat.messages" class="lup-msg place-message" in-view="$inview&&onMessageRead(msg)" ng-class="{'lup-own-msg':msg.isOwnMessage(),'lup-notification-unread':!msg.readMyself()}"><button class="place-message-avatar" type="button" ng-if="!msg.isOwnMessage()" ng-click="gotoProfile(msg.fromUser())" aria-label="{{msg.fromUser().displayName()}}"><lup-avatar ng-user="msg.fromUser()"></lup-avatar></button><div class="place-message-content" lup-effect="msg.effect"><div class="place-message-meta"><strong>{{msg.fromUser().displayName()}}</strong><time>{{msg.sent()|msgDate:'HH:mm'}}</time></div><div class="place-bubble"><span>{{msg.text()}}</span><lup-msg-state message="msg"></lup-msg-state></div></div></div></div><form class="chatbottom place-composer" ng-submit="sendMessage()"><input type="text" ng-model="data.message" placeholder="{{'QUERY_PLACEHOLDER'|translate}}" aria-label="{{'QUERY_PLACEHOLDER'|translate}}" autocomplete="off" enterkeyhint="send"><button type="submit" class="place-send place-send-link" ng-disabled="data.querySending || !data.message.trim()" aria-label="{{'PLACE_SEND'|translate}}"><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path d="m5 5 18 9-18 9 4-9-4-9Zm4 9h14"/><path d="M5 23 2 24M4 18l-2 1" opacity=".5"/></svg></button></form></div>
