<section layout="row" flex class="login register-page auth-shell">
  <md-content flex class="auth-canvas">
    <svg class="register-ambient-route" viewBox="0 0 720 980" preserveAspectRatio="none" aria-hidden="true">
      <path class="register-ambient-base" d="M-72,168 C144,92 138,340 338,316 S506,518 752,451" />
      <path class="register-ambient-base register-ambient-base-lower" d="M-63,714 C149,635 210,894 419,824 S586,734 768,868" />
      <circle class="register-ambient-point" cx="338" cy="316" r="5" />
      <circle class="register-ambient-point register-ambient-point-late" cx="419" cy="824" r="5" />
    </svg>
    <section class="auth-hero" aria-label="LinkUUp">
      <svg class="auth-route" viewBox="0 0 720 440" aria-hidden="true">
        <path class="auth-route-base" d="M-50,352 C112,325 104,99 296,138 S432,389 617,255 S718,91 796,114" />
        <path class="auth-route-light" d="M-50,352 C112,325 104,99 296,138 S432,389 617,255 S718,91 796,114" />
        <circle cx="296" cy="138" r="7" class="auth-route-point" />
        <circle cx="617" cy="255" r="7" class="auth-route-point auth-route-point-late" />
      </svg>
      <div class="auth-hero-copy">
        <div class="auth-hero-meta"><span></span>DEIN START</div>
        <span class="auth-mark"><i class="material-icons">location_on</i></span>
        <div class="login-wordmark" aria-label="LinkUUp"><span class="login-wordmark-link">link</span><span class="login-wordmark-up">uup</span></div>
        <p class="login-brand-claim">Dein Profil. Deine Orte. Deine Begegnungen.</p>
      </div>
    </section>

    <section class="auth-panel register-panel" aria-label="Registrieren">
      <p class="auth-kicker">LINKUUP START</p>
      <h1>Neu dabei</h1>
      <p class="auth-intro">Erstelle dein Profil und entscheide selbst, was sichtbar ist.</p>
      <ng-include src="'js/pages/register/lup-register-form.html?v='+V"></ng-include>
    </section>

    <nav class="auth-legal" aria-label="Rechtliches">
      <button type="button" ng-click="gotoImpressum()">{{'IMPRESSUM'|translate}}</button>
      <span aria-hidden="true"></span>
      <button type="button" ng-click="gotoPrivacy()">{{'PRIVACY'|translate}}</button>
    </nav>
  </md-content>
</section>
