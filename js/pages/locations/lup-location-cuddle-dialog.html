<md-dialog class="lup-location-cuddle-dialog" aria-label="Location cuddlen">
  <div class="lup-location-cuddle-content">
    <button type="button" class="lup-location-cuddle-close" ng-click="cancel()" aria-label="Schließen"><i class="material-icons">close</i></button>
    <div class="lup-location-cuddle-seal"><i class="material-icons">qr_code_2</i></div>
    <span class="lup-location-cuddle-eyebrow">CUDDLE VOR ORT</span>
    <h2>{{data.room.name()}}</h2>
    <p>Zeige diesen Code der Person, mit der du gerade hier bist. Ihr Scan gibt euch beiden einen Cuddle.</p>
    <div class="lup-cuddles-qr"><img class="qrcode" src="{{data.url}}" alt="Dein Cuddle-QR-Code" /></div>
    <div class="lup-location-cuddle-rule"><i class="material-icons">verified</i><span>Ein Cuddle pro Paar, Location und UTC-Tag</span></div>
    <p class="lup-location-cuddle-note">Der Code läuft nach kurzer Zeit ab und kann nur einmal verwendet werden.</p>
    <button type="button" class="lup-location-cuddle-done" ng-click="cancel()">Verstanden</button>
  </div>
</md-dialog>
