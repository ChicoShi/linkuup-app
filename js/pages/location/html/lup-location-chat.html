<div class="location-chat-surface place-chat" layout="column" flex>
  <div class="place-ambient-route" aria-hidden="true"><span></span></div>
  <div class="place-preview-conversation" ng-if="isPresencePreview()"><lup-presence ng-room="data.room" simulate="true"></lup-presence><p>{{'PREVIEW_NOTE'|translate}}</p><div class="place-message" ng-repeat="user in previewGuests().slice(0,3)"><lup-avatar ng-user="user"></lup-avatar><div class="place-message-content"><div class="place-message-meta"><strong>{{user.displayName()}}</strong></div><p class="place-bubble">{{('PREVIEW_MESSAGE_'+($index+1))|translate}}</p></div></div></div>
  <div class="chat-msgs place-messages" role="log" aria-label="{{'PLACE_ROOM_CHAT'|translate}}" aria-live="polite" aria-relevant="additions text">
    <div ng-repeat="msg in data.room.MESSAGES" class="lup-msg place-message" lup-effect="msg.effect" in-view="$inview&&onMessageRead(msg)" in-view-options="{considerPageVisibility:true}" ng-class="{'lup-own-msg':msg.isOwnMessage(),'lup-system-msg':msg.isSystemMessage(),'lup-shout-msg':msg.shout,'lup-notification-unread':!msg.read,'lup-other-msg':!msg.isOwnMessage() && !msg.isSystemMessage()}">
      <button class="place-message-avatar" type="button" ng-if="!msg.isSystemMessage() && !msg.isOwnMessage()" ng-click="gotoProfile(msg.user)" aria-label="{{msg.user.displayName()}}"><lup-avatar ng-user="msg.user"></lup-avatar></button>
      <div class="place-message-content"><div class="place-message-meta" ng-if="!msg.isSystemMessage()"><strong>{{msg.user.displayName()}}</strong><time>{{msg.time|msgDate:'HH:mm'}}</time></div><span class="place-shout-label" ng-if="msg.shout">{{'PLACE_SHOUT'|translate}}</span><p class="place-bubble">{{msg.text}}</p></div>
    </div>
  </div>
  <button type="button" class="place-new-messages" ng-if="data.newRoomMessages" ng-click="scrollChatToBottom(false)" aria-label="{{'PLACE_NEW_MESSAGES'|translate}}"><span>{{'PLACE_NEW_MESSAGES'|translate}}</span><i class="material-icons" aria-hidden="true">arrow_downward</i></button>
  <form class="chatbottom place-composer" ng-if="!isPresencePreview() && data.room.isSelfInRoom() && inChatRange()" ng-submit="sendMessage()">
    <input type="text" ng-model="data.message" placeholder="{{'PLACE_MESSAGE'|translate}}" aria-label="{{'PLACE_MESSAGE'|translate}}" autocomplete="off" enterkeyhint="send" />
    <button type="button" class="place-icon-button" ng-click="sendShout()" ng-disabled="!data.message.trim()" aria-label="{{'PLACE_SEND_SHOUT'|translate}}"><i class="material-icons" aria-hidden="true">campaign</i></button>
    <button type="submit" class="place-send" ng-disabled="!data.message.trim()" aria-label="{{'PLACE_SEND'|translate}}"><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path d="M4 5.5 24 14 4 22.5l3-8.5-3-8.5Z"/><path d="M7 14h17"/></svg></button>
  </form>
  <div class="place-join-state" ng-if="(!data.room.isSelfInRoom() || !inChatRange())"><p>{{(data.chatJoining ? 'PLACE_JOINING' : 'PLACE_CHAT_RANGE')|translate}}</p><button class="place-tool" ng-if="!data.chatJoining" type="button" ng-click="joinChat($event)"><i class="material-icons" aria-hidden="true">login</i>{{'PLACE_JOIN'|translate}}</button></div>
</div>
