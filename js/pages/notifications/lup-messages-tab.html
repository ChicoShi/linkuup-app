<md-content class="place-social-scroll" flex><div class="place-content"><header class="place-social-heading"><span class="place-eyebrow">{{'PLACE_MESSAGES_EYEBROW'|translate}}</span><h1>{{'PLACE_MESSAGES_TITLE'|translate}}</h1><p>{{'PLACE_MESSAGES_COPY'|translate}}</p></header><div class="place-thread-list"><article class="place-thread" ng-repeat="query in sortedQueries() track by query.id()" ng-class="{'is-unread':query.unreadCount()>0}"><button class="place-thread-avatar" type="button" ng-click="gotoProfile(query.user())" aria-label="{{query.user().displayName()}}"><lup-avatar ng-user="query.user()"></lup-avatar></button><button class="place-thread-open" type="button" ng-click="gotoQueryThread(query)"><span><strong>{{query.user().displayName()}}</strong><time ng-if="query.lastDate()">{{query.lastDate()|msgDate:'HH:mm'}}</time></span><span class="place-thread-preview">{{query.lastText()}}</span><b class="place-thread-unread" ng-if="query.unreadCount()>0" aria-label="{{'PLACE_UNREAD'|translate}}">{{query.unreadCount()}}</b></button><button class="place-thread-delete" type="button" ng-click="deleteChat(query)" aria-label="{{'DLGT_DELETE_CHAT'|translate}}"><i class="material-icons" aria-hidden="true">delete_outline</i></button></article></div><section class="place-empty" ng-if="!data.loadingChats && !sortedQueries().length"><span class="place-empty-mark"><i class="material-icons" aria-hidden="true">chat_bubble_outline</i></span><h3>{{'PLACE_MESSAGES_EMPTY'|translate}}</h3><p>{{'MSG_NO_PRIVATE_MESSAGES'|translate}}</p></section><p class="place-voices-loading" role="status" ng-if="data.loadingChats && !sortedQueries().length">{{'PLACE_MESSAGES_LOADING'|translate}}</p></div></md-content>
