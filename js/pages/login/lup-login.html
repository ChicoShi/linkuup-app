<section layout="row" flex class="login">

  <md-content flex>
  
	<section class="login-brand-stage" layout="column" layout-padding flex>
		<div class="login-brand-glow" aria-hidden="true"></div>
		<div class="login-wordmark" aria-label="LinkUUp">
			<span class="login-wordmark-link">Link</span><span class="login-wordmark-up">UUp</span>
		</div>
		<p class="login-brand-claim">Menschen. Orte. Gemeinsam unterwegs.</p>
		<div class="login-brand-route" aria-hidden="true"><i class="material-icons">near_me</i><span></span><i class="material-icons">favorite</i></div>
	</section>

    <!-- CONTENT -->
    <ng-include src="'js/pages/login/lup-login-form.html?v='+V" flex></ng-include>
	
    <!-- END CONTENT -->
	<section layout="column" layout-padding flex>
		<div class="login-bottom login-page">
		  <md-list-item class="md-1-line" ng-click="gotoImpressum()">
			<p class="impressum">{{'IMPRESSUM'|translate}}</p>
		  </md-list-item>
<!--
		  <md-list-item class="md-1-line" ng-click="gotoTOS()">
			<p class="tos">{{'TOS'|translate}}</p>
		  </md-list-item>
-->
		  <md-list-item class="md-1-line" ng-click="gotoPrivacy()">
			<p class="privacy">{{'PRIVACY'|translate}}</p>
		  </md-list-item>
		</div>
	</section>
  </md-content>
  
</section>
