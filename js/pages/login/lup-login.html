<section layout="row" flex class="login auth-shell">
  <md-content flex class="auth-canvas">
    <svg class="auth-route auth-route-global" viewBox="0 0 720 1120" aria-hidden="true">
      <path class="auth-route-base" d="M-76,228 C145,158 99,395 304,376 S545,182 764,311 M-55,681 C125,610 244,794 411,706 S596,513 777,645" />
      <path class="auth-route-light" d="M-76,228 C145,158 99,395 304,376 S545,182 764,311 M-55,681 C125,610 244,794 411,706 S596,513 777,645" />
      <circle cx="304" cy="376" r="6" class="auth-route-point" />
      <circle cx="411" cy="706" r="6" class="auth-route-point auth-route-point-late" />
    </svg>
    <section class="auth-hero" aria-label="LinkUUp">
      <div class="auth-hero-copy">
        <div class="auth-hero-meta"><span></span>LIVE IN DEINER NÄHE</div>
        <span class="auth-mark"><i class="material-icons">location_on</i></span>
        <div class="login-wordmark" aria-label="LinkUUp"><span class="login-wordmark-link">link</span><span class="login-wordmark-up">uup</span></div>
        <p class="login-brand-claim">Raus aus dem Feed.<br>Rein ins Leben.</p>
        <p class="auth-hero-detail">Entdecke Orte, an denen gerade wirklich etwas passiert.</p>
      </div>
    </section>

    <section class="auth-panel" aria-label="Anmelden">
      <p class="auth-kicker"><span></span> DEIN ZUGANG</p>
      <h1>Willkommen zurück</h1>
      <p class="auth-intro">Melde dich an, finde deine Orte und triff Menschen nicht nur online.</p>
      <ng-include src="'js/pages/login/lup-login-form.html?v='+V"></ng-include>
    </section>

    <nav class="auth-legal" aria-label="Rechtliches">
      <button type="button" ng-click="gotoImpressum()">{{'IMPRESSUM'|translate}}</button>
      <span aria-hidden="true"></span>
      <button type="button" ng-click="gotoPrivacy()">{{'PRIVACY'|translate}}</button>
    </nav>
  </md-content>
</section>
