<md-dialog class="lup-cuddles-dialog" aria-label="{{'CUDDLES'|translate}}">
  <form ng-cloak>
    <md-dialog-content>
      <div class="lup-cuddles-dialog-content">
        <button class="lup-cuddles-close" type="button" ng-click="cancel()" aria-label="{{'CLOSE'|translate}}"><i class="material-icons">close</i></button>
        <div class="lup-cuddles-heart"><i class="material-icons">favorite</i></div>
        <h2>{{'CUDDLES_SHOW_QR'|translate}}</h2>
		<p>{{'CUDDLES_QR_COPY'|translate}}</p>
        <div class="lup-cuddles-qr"><img class="qrcode" src="{{data.url}}" alt="{{'CUDDLES_SHOW_QR'|translate}}" /></div>
		<span class="lup-cuddles-hint"><i class="material-icons">qr_code_2</i> {{'CUDDLES_RULE'|translate}}</span>
      </div>
    </md-dialog-content>
  </form>
</md-dialog>
