<md-dialog class="lup-cuddles-dialog highfive-qr-dialog" aria-label="{{'HIGHFIVE_MENU_QR_TITLE'|translate}}">
  <form ng-cloak>
    <md-dialog-content>
      <div class="lup-cuddles-dialog-content highfive-qr-dialog-content">
        <button class="lup-cuddles-close" type="button" ng-click="cancel()" aria-label="{{'CLOSE'|translate}}"><i class="material-icons">close</i></button>
        <div class="highfive-qr-mark" aria-hidden="true"><i class="material-icons">front_hand</i><i class="material-icons">qr_code_2</i></div>
        <span class="highfive-qr-eyebrow">{{'HIGHFIVE_EYEBROW'|translate}}</span>
        <h2>{{'HIGHFIVE_MENU_QR_TITLE'|translate}}</h2>
		<p>{{'CUDDLES_QR_COPY'|translate}}</p>
        <div class="highfive-qr-frame"><div class="lup-cuddles-qr"><img class="qrcode" src="{{data.url}}" alt="{{'HIGHFIVE_MENU_QR_TITLE'|translate}}" /></div></div>
		<span class="highfive-qr-rule"><i class="material-icons">verified</i> {{'HIGHFIVE_RULE_COPY'|translate}}</span>
      </div>
    </md-dialog-content>
  </form>
</md-dialog>
