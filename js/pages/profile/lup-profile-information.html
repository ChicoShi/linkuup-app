<md-content
 flex layout-padding
 ng-if="!data.profile.canGloballySee() && !data.user.isSelf()">
  <p>{{'VIEW_NOT_ALLOWED'|translate}}</p>
</md-content>

<md-list class="profile-information profile-about-single" ng-if="data.profile.canGloballySee() || data.user.isSelf()">
  <md-list-item class="md-2-line profile-story-card">
    <md-list-item-text>
      <div class="profile-about-kicker" aria-hidden="true"><i class="material-icons">person_outline</i><span>{{'PROFILE_ABOUT_KICKER'|translate}}</span></div>
      <div class="profile-about-route" aria-hidden="true"><span></span><b></b><em></em><i class="material-icons">location_on</i></div>
      <p class="profile-about-me" ng-if="data.profile.displayAbout()">{{data.profile.displayAbout()}}</p>
      <div class="profile-about-empty" ng-if="!data.profile.displayAbout()">
        <p>{{ 'PROFILE_ABOUT_EMPTY' | translate }}</p>
        <button type="button" ng-if="data.user.isSelf()" ng-click="openProfileSettings($event)">
          <i class="material-icons" aria-hidden="true">edit</i>{{ 'PROFILE_ABOUT_EDIT' | translate }}
        </button>
      </div>
    </md-list-item-text>
  </md-list-item>
</md-list>

<div class="profile-disclosure" ng-if="(data.profile.canGloballySee() || data.user.isSelf()) && data.profileGroups.length">
  <button type="button" ng-click="toggleProfileDetails()" ng-attr-aria-expanded="{{!!data.profileDetailsOpen}}" aria-controls="profile-insight-content">
    <span>{{(data.profileDetailsOpen ? 'PROFILE_INSIGHT_CLOSE' : 'PROFILE_INSIGHT_OPEN')|translate}}</span>
    <i class="material-icons" aria-hidden="true">{{data.profileDetailsOpen ? 'expand_less' : 'expand_more'}}</i>
  </button>
</div>

<div id="profile-insight-content" class="profile-facts-panel" ng-if="(data.profile.canGloballySee() || data.user.isSelf()) && data.profileGroups.length" ng-show="data.profileDetailsOpen">
  <section class="profile-facts">
    <section ng-repeat="group in data.profileGroups track by group.module" class="profile-fact-group">
      <header class="profile-fact-group-heading"><span></span><small>{{group.label|translate}}</small></header>
      <div class="profile-fact-grid">
        <article class="profile-fact" ng-repeat="field in group.fields track by field.key" ng-class="['profile-fact--tone-' + profileFieldTone(field.key), {'profile-fact--lit': !field.private && !field.error && !field.empty, 'profile-fact--denied': field.error, 'profile-fact--private': field.private, 'profile-fact--public': field.visibility === 'public', 'profile-fact--members': field.visibility === 'members', 'profile-fact--friends': field.visibility === 'friends'}]">
          <span class="profile-fact-icon" aria-hidden="true"><i class="material-icons">{{profileFieldIcon(field.key)}}</i></span>
          <div class="profile-fact-copy">
            <small>{{field.label|translate}}</small>
            <strong ng-if="field.visible" ng-bind-html="renderProfileSetting(field)"></strong>
            <span class="profile-fact-unavailable" ng-if="!field.visible" aria-label="{{'PROFILE_FIELD_UNAVAILABLE'|translate}}"></span>
          </div>
        </article>
      </div>
    </section>
  </section>
</div>
