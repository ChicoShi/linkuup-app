<md-content
 flex layout-padding
 ng-if="!data.profile.canGloballySee() && !data.user.isSelf()">
  <p>{{'VIEW_NOT_ALLOWED'|translate}}</p>
</md-content>

<md-list class="profile-information profile-about-single" ng-if="data.profile.canGloballySee() || data.user.isSelf()">
  <md-list-item class="md-2-line profile-story-card">
    <md-list-item-text>
      <div class="profile-about-kicker" aria-hidden="true"><i class="material-icons">person_outline</i><span>{{'PROFILE_ABOUT_KICKER'|translate}}</span></div>
      <div class="profile-about-route" aria-hidden="true"><span></span><b></b><em></em><i class="material-icons">location_on</i></div>
      <p class="profile-about-me" ng-if="data.profile.displayAbout()">{{data.profile.displayAbout()}}</p>
      <div class="profile-about-empty" ng-if="!data.profile.displayAbout()">
        <p>{{ 'PROFILE_ABOUT_EMPTY' | translate }}</p>
        <button type="button" ng-if="data.user.isSelf()" ng-click="openProfileSettings($event)">
          <i class="material-icons" aria-hidden="true">edit</i>{{ 'PROFILE_ABOUT_EDIT' | translate }}
        </button>
      </div>
    </md-list-item-text>
  </md-list-item>
</md-list>

<md-list class="profile-information profile-settings-view" ng-if="(data.profile.canGloballySee() || data.user.isSelf()) && data.profileGroups.length">
  <section ng-repeat="group in data.profileGroups track by group.module" class="profile-settings-group">
    <md-subheader class="md-no-sticky">{{group.label|translate}}</md-subheader>
    <md-list-item class="md-2-line profile-detail-card" ng-repeat="field in group.fields track by field.key" ng-class="{'profile-setting-denied': field.error}">
      <div class="profile-detail-icon" aria-hidden="true"><i class="material-icons">{{profileFieldIcon(field.key)}}</i></div>
      <div class="md-list-item-text" layout="column">
        <h3>
          {{field.label|translate}}
        </h3>
        <p ng-if="field.error"><i class="material-icons" aria-hidden="true">visibility_off</i> {{field.error}}</p>
        <p ng-if="!field.error" ng-bind-html="renderProfileSetting(field)"></p>
      </div>
    </md-list-item>
  </section>
</md-list>
