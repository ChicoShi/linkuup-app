<md-dialog class="place-dialog profile-up-info" aria-labelledby="profile-up-info-title" aria-describedby="profile-up-info-copy">
  <md-dialog-content>
    <span class="profile-up-info-heart" aria-hidden="true"><i class="material-icons">favorite</i></span>
    <h2 id="profile-up-info-title">{{'PROFILE_UP_INFO_TITLE'|translate}}</h2>
    <p id="profile-up-info-copy">{{'PROFILE_UP_INFO_BODY'|translate}}</p>
    <p class="profile-up-info-hint">{{'PROFILE_UP_INFO_HELP'|translate}}</p>
  </md-dialog-content>
  <md-dialog-actions><md-button class="md-primary" ng-click="ok()">{{'PROFILE_UP_INFO_OK'|translate}}</md-button></md-dialog-actions>
</md-dialog>
