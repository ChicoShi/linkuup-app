<md-dialog class="place-dialog place-qr-dialog" aria-label="{{'QR_FRIEND_DIALOG_TITLE'|translate}}">
  <form ng-cloak><header class="place-dialog-header"><span class="place-dialog-symbol" aria-hidden="true"><i class="material-icons">qr_code_2</i></span><div><span>{{'PLACE_CATEGORY'|translate}}</span><h2>{{'QR_FRIEND_DIALOG_TITLE'|translate}}</h2></div><button class="place-dialog-close" type="button" ng-click="cancel()" aria-label="{{'PLACE_CLOSE'|translate}}"><i class="material-icons" aria-hidden="true">close</i></button></header>
    <md-dialog-content><div class="place-dialog-body"><p class="place-dialog-copy">{{'QR_FRIEND_DIALOG_PARAGRAPH'|translate}}</p><a class="place-qr-code" ng-href="{{data.target}}" aria-label="{{'PLACE_MY_PROFILE'|translate}}"><img class="qrcode" ng-src="{{data.url}}" alt="{{'QR_FRIEND_DIALOG_TITLE'|translate}}"></a></div></md-dialog-content>
    <footer class="place-dialog-actions"><button class="place-dialog-primary" type="button" ng-click="cancel()">{{'PLACE_DONE'|translate}}</button></footer>
  </form>
</md-dialog>
