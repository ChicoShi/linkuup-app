<ng-include
 ng-if="data.frienduser.isSelf()"
 src="'js/pages/friends/lup-friends-search.html?v='+V"></ng-include>

<!-- Begin user list -->
<md-list class="friends-list" flex>
  
  <md-subheader class="md-no-sticky">
    <div
     translate="SUBHEADER_FRIENDS"
     translate-value-user="{{data.frienduser.displayName()}}"
     translate-value-count="{{data.pagemenu.nItems}}"></div>
  </md-subheader>

  <div class="lup-user-list">
    <md-list-item
     class="md-2-line"
     ng-repeat="user in sortedFriends()"
     on-long-press="deleteFriend(user)"
     class="no-right">
      <lup-avatar ng-user="user" ng-click="gotoProfile(user)"></lup-avatar>
      <div class="md-list-item-text" layout="column">
        <p class="username">{{ user.displayName(); }}</p>
        <p class="lup-user-status">{{ user.status(); }}</p>
      </div>
      <div class="lup-user-actions">
        <button
         class="lup-user-action lup-user-action-remove"
         type="button"
         aria-label="Freund entfernen"
         title="Freund entfernen"
         ng-click="deleteFriend(user)"
         ng-if="!user.isSelf() && user.isMember() && user.isFriend()"><i class="material-icons">person_remove_alt_1</i></button>
        <button
         class="lup-user-action lup-user-action-message"
         type="button"
         aria-label="Nachricht senden"
         title="Nachricht senden"
         ng-click="gotoQuery(user)"
         ng-if="!user.isSelf()"><i class="material-icons">chat_bubble</i></button>
      </div>
    </md-list-item>
  </div>
</md-list>
<!-- End of user list -->
