<section class="place-friend-search" ng-controller="SearchFriendsCtrl"><div class="place-search-row"><label class="place-search"><i class="material-icons" aria-hidden="true">search</i><input type="search" ng-model="data.friendsearch" ng-model-options="{debounce:200}" ng-change="searchFriends(data.friendsearch)" placeholder="{{'SEARCH_NEW_FRIENDS'|translate}}" aria-label="{{'SEARCH_NEW_FRIENDS'|translate}}" autocomplete="off"></label><button class="place-search-qr" type="button" ng-click="showQRCode()" aria-label="{{'QR_FRIEND_DIALOG_TITLE'|translate}}"><i class="material-icons" aria-hidden="true">qr_code_2</i></button></div><div class="place-friend-results" ng-if="data.friendsearchusers.length"><article class="place-friend" ng-repeat="user in data.friendsearchusers track by user.id()"><button class="place-friend-profile" type="button" ng-click="gotoProfile(user)"><lup-avatar ng-user="user"></lup-avatar><span><strong>{{user.displayName()}}</strong><small>{{user.status()}}</small></span></button><button class="place-search-qr" type="button" ng-if="!user.isSelf() && data.ownUser.isAuthed() && !user.isPreview && !user.isFriend() && !user.JSON.relation_pending && !user.JSON.relation_incoming" ng-click="FriendSrvc.addFriend(user).catch(catchUnknown)" ng-disabled="FriendSrvc.busy[user.id()]" aria-label="{{'PROFILE_ACTION_ADD_FRIEND'|translate}}"><i class="material-icons" aria-hidden="true">person_add_alt_1</i></button><button class="place-search-qr" type="button" ng-if="!user.isSelf() && data.ownUser.isAuthed() && !user.isPreview && !user.isFriend() && user.JSON.relation_pending" ng-click="FriendSrvc.cancelFriendRequest(user).catch(catchUnknown)" ng-disabled="FriendSrvc.busy[user.id()]" aria-label="{{'PROFILE_ACTION_FRIEND_PENDING'|translate}}"><i class="material-icons" aria-hidden="true">hourglass_top</i></button></article></div></section>
