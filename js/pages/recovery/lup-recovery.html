<section layout="row" flex class="login recovery-page">

  <md-content flex>

	<section class="login-brand-stage recovery-brand-stage" layout="column" layout-padding flex>
		<div class="login-brand-glow" aria-hidden="true"></div>
		<div class="login-symbol" aria-hidden="true"><i class="material-icons">place</i></div>
		<div class="login-wordmark" aria-label="LinkUUp"><span class="login-wordmark-link">link</span><span class="login-wordmark-up">uup</span></div>
		<p class="login-brand-claim">Setze dein Passwort sicher zurück.</p>
	</section>
	
    <!-- CONTENT -->
	<section class="recovery-panel" layout="column" layout-padding flex>
		<ng-include src="'js/pages/recovery/lup-recovery-form.html?v='+V"></ng-include>
    </section>
    <!-- END CONTENT -->
	<section layout="column" layout-padding flex>
		<div class="login-bottom login-page">
		  <md-list-item class="md-1-line" ng-click="gotoImpressum()">
			<p class="impressum">{{'IMPRESSUM'|translate}}</p>
		  </md-list-item>
<!--
		  <md-list-item class="md-1-line" ng-click="gotoTOS()">
			<p class="tos">{{'TOS'|translate}}</p>
		  </md-list-item>
-->
		  <md-list-item class="md-1-line" ng-click="gotoPrivacy()">
			<p class="privacy">{{'PRIVACY'|translate}}</p>
		  </md-list-item>
		</div>
	</section>
  </md-content>
</section>
