<section layout="row" flex class="login recovery-page auth-shell">
  <md-content flex class="auth-canvas">
    <svg class="recovery-ambient-route" viewBox="0 0 720 980" preserveAspectRatio="none" aria-hidden="true">
      <path class="recovery-ambient-base" d="M-60,174 C95,118 158,325 332,284 S525,459 755,402" />
      <path class="recovery-ambient-base recovery-ambient-base-lower" d="M-60,726 C160,658 215,862 420,805 S605,736 765,879" />
      <circle class="recovery-ambient-point" cx="332" cy="284" r="5" />
      <circle class="recovery-ambient-point recovery-ambient-point-late" cx="420" cy="805" r="5" />
    </svg>
    <section class="auth-hero" aria-label="LinkUUp">
      <svg class="auth-route" viewBox="0 0 720 440" aria-hidden="true">
        <path class="auth-route-base" d="M-50,352 C112,325 104,99 296,138 S432,389 617,255 S718,91 796,114" />
        <path class="auth-route-light" d="M-50,352 C112,325 104,99 296,138 S432,389 617,255 S718,91 796,114" />
        <circle cx="296" cy="138" r="7" class="auth-route-point" />
        <circle cx="617" cy="255" r="7" class="auth-route-point auth-route-point-late" />
      </svg>
      <div class="auth-hero-copy">
        <div class="auth-hero-meta"><span></span>{{'RECOVERY_HERO_META'|translate}}</div>
        <span class="auth-mark"><i class="material-icons">lock_open</i></span>
        <div class="login-wordmark" aria-label="LinkUUp"><span class="login-wordmark-link">link</span><span class="login-wordmark-up">uup</span></div>
        <p class="login-brand-claim">{{'RECOVERY_HERO_CLAIM'|translate}}</p>
        <p class="auth-hero-detail">{{'RECOVERY_HERO_DETAIL'|translate}}</p>
      </div>
    </section>
    <section class="auth-panel recovery-panel" aria-label="Passwort zurücksetzen">
      <p class="auth-kicker"><span></span> {{'RECOVERY_KICKER'|translate}}</p>
      <h1>{{'TITLE_RECOVERY'|translate}}</h1>
      <p class="auth-intro">{{'RECOVERY_INTRO'|translate}}</p>
      <ng-include src="'js/pages/recovery/lup-recovery-form.html?v='+V"></ng-include>
    </section>
    <nav class="auth-legal" aria-label="Rechtliches">
      <button type="button" ng-click="gotoImpressum()">{{'IMPRESSUM'|translate}}</button>
      <span aria-hidden="true"></span>
      <button type="button" ng-click="gotoPrivacy()">{{'PRIVACY'|translate}}</button>
    </nav>
  </md-content>
</section>
